[package]
name = "rgconf-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "PyO3 bindings for rgconf, matching the rgmin python crate."
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.24"
rgconf = { path = "../crates/rgconf-core" }
